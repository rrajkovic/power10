<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;">
        <tr>
          <td style="font-size:22px;font-weight:700;color:#111827;padding-bottom:8px;">
            Confirm your email
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;color:#4b5563;padding-bottom:24px;line-height:1.5;">
            Your confirmation code is:
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <div style="display:inline-block;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:16px 24px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#111827;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;color:#4b5563;line-height:1.5;padding-bottom:24px;">
            Enter it in the app to finish creating your account. The code expires in 1 hour.
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;color:#9ca3af;line-height:1.5;border-top:1px solid #f3f4f6;padding-top:16px;">
            On a computer? You can also <a href="{{ .ConfirmationURL }}" style="color:#2563eb;">confirm with this link</a>.<br>
            If you didn't create an account, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
